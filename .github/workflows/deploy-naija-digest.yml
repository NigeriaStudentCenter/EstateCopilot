name: Deploy Naija Digest

on:
  push:
    branches: [main]
    paths:
      - 'naija-digest/**'
      - '.github/workflows/deploy-naija-digest.yml'
  schedule:
    # Every 30 minutes — refreshes the feed even with no code changes.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # A stuck run (see 2026-08-26: build-feed hung 10+ min on a stalled RSS
  # response) used to block every subsequent push/schedule behind it with
  # no way to cancel remotely. The real fix is the hard per-source timeout
  # in build-feed.ts, but this is the safety net: a stuck run should never
  # be able to block progress indefinitely.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Normal successful runs already take ~5-5.5 minutes for legitimate
    # work (npm ci alone is a big chunk of that) — 5 minutes here left
    # zero margin and killed a real, successful build on 2026-08-26 for no
    # reason. build-feed itself can't run away past ~20-30s regardless
    # (see the hard per-source timeout in build-feed.ts); this cap exists
    # only to catch something else hanging for real, so it can afford to
    # be generous.
    timeout-minutes: 12
    defaults:
      run:
        working-directory: naija-digest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build-feed
      - run: npm run build-digest
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: naija-digest/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
