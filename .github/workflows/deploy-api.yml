name: Deploy backend API

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

# Requires this repo secret:
#   AZURE_WEBAPP_PUBLISH_PROFILE_API  — App Service -> "Get publish profile"
# Target: the existing Azure Web App below (Linux, NODE|22-lts, resource group
# estatecopilot-rg). Set these App Service settings once:
#   SCM_DO_BUILD_DURING_DEPLOYMENT=false   (CI ships the prebuilt dist/ + node_modules)
#   startup command:  npm run start
# Migrations: the API applies them itself when it starts (backend/src/lib/
# migrateOnStart.ts, App Service setting RUN_MIGRATIONS_ON_START=true), so a
# commit that adds prisma/migrations/* reaches the prod DB with no manual step.
# They used to run through Kudu's /api/command, which Azure cuts off at about
# 4 minutes (HTTP 504). Also set WEBSITES_CONTAINER_START_TIME_LIMIT=600 so a
# slow migration doesn't count as a failed start. (Same pattern as Kolo.)
env:
  AZURE_WEBAPP_NAME: estatecopilot-api
  NODE_VERSION: '22'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build
        working-directory: backend
        run: npm run build

      # Startup migrations are what keep the DB schema in step with the code, so
      # refuse to deploy if the setting is missing (Kudu lists app settings).
      - name: Check startup migrations are on
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
        run: |
          set -euo pipefail
          read -r KUSER KPASS < <(python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.fromstring(os.environ["PUBLISH_PROFILE"])
          p = next(e for e in root.iter("publishProfile") if e.get("publishMethod") == "MSDeploy")
          print(p.get("userName"), p.get("userPWD"))
          PY
          )
          on=$(curl -sS -u "$KUSER:$KPASS" -m 60 "https://${AZURE_WEBAPP_NAME}.scm.azurewebsites.net/api/settings" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("RUN_MIGRATIONS_ON_START",""))')
          [ "$on" = "true" ] || { echo "::error::set RUN_MIGRATIONS_ON_START=true on ${AZURE_WEBAPP_NAME} first, or migrations won't run"; exit 1; }
          echo "startup migrations: on"
          echo "DEPLOY_STARTED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      # Ships node_modules + the compiled dist/ as-is. Set the App Service
      # setting SCM_DO_BUILD_DURING_DEPLOYMENT=false and startup command
      # "npm run start" so Azure runs the prebuilt output without rebuilding.
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: backend

      # The deploy restarts the app; it migrates, then starts serving. Wait for a
      # worker that started after this deploy did: the old one keeps answering
      # /health for a minute or so, and must not be mistaken for the new one.
      - name: Wait for the API (runs migrations on start)
        shell: bash
        run: |
          health="https://${AZURE_WEBAPP_NAME}.azurewebsites.net/health"
          for i in $(seq 1 40); do
            started=$(curl -fsS -m 15 "$health" 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin).get("startedAt",""))' 2>/dev/null || true)
            if [[ -n "$started" && "$started" > "$DEPLOY_STARTED" ]]; then echo "new worker up (started $started) after ~$((i*15))s"; exit 0; fi
            sleep 15
          done
          echo "::error::no new worker on $health within 10 min; if migrations failed, the App Service log stream has the [startup] output"; exit 1
